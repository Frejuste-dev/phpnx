# PHPNX Docker Compose - Le Phoenix s'élève avec Docker !
# Configuration Docker Compose pour PHPNX

version: '3.8'

services:
  # Service principal PHPNX
  phpnx:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: phpnx-server
    restart: unless-stopped
    ports:
      - "80:80"           # NGINX HTTP
      - "443:443"         # NGINX HTTPS (si SSL activé)
      - "8765:8765"       # WebSocket
    volumes:
      # Projets PHP
      - ../app:/opt/phpnx/app
      - ../projects:/opt/phpnx/projects
      # Configuration
      - ../config:/opt/phpnx/config
      # Logs
      - phpnx-logs:/opt/phpnx/logs
      # SSL (optionnel)
      - ../ssl:/opt/phpnx/ssl
      # Plugins
      - ../plugins:/opt/phpnx/plugins
    environment:
      - PHPNX_VERSION=1.0.0
      - PHP_PORT=9000
      - NGINX_PORT=80
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Paris
    networks:
      - phpnx-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Base de données MySQL (optionnelle)
  mysql:
    image: mysql:8.0
    container_name: phpnx-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: phpnx_root_password
      MYSQL_DATABASE: phpnx_db
      MYSQL_USER: phpnx_user
      MYSQL_PASSWORD: phpnx_password
    volumes:
      - phpnx-mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    networks:
      - phpnx-network
    profiles:
      - database

  # Base de données PostgreSQL (alternative)
  postgres:
    image: postgres:15
    container_name: phpnx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: phpnx_db
      POSTGRES_USER: phpnx_user
      POSTGRES_PASSWORD: phpnx_password
    volumes:
      - phpnx-postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - phpnx-network
    profiles:
      - database
      - postgres

  # Redis pour le cache (optionnel)
  redis:
    image: redis:7-alpine
    container_name: phpnx-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass phpnx_redis_password
    volumes:
      - phpnx-redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - phpnx-network
    profiles:
      - cache

  # Mailhog pour les tests d'email (optionnel)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: phpnx-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Interface web
    networks:
      - phpnx-network
    profiles:
      - mail

  # Adminer pour la gestion de base de données (optionnel)
  adminer:
    image: adminer:latest
    container_name: phpnx-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    networks:
      - phpnx-network
    profiles:
      - database
      - tools
    depends_on:
      - mysql

  # Monitoring avec Portainer (optionnel)
  portainer:
    image: portainer/portainer-ce:latest
    container_name: phpnx-portainer
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - phpnx-portainer-data:/data
    networks:
      - phpnx-network
    profiles:
      - monitoring

# Réseaux
networks:
  phpnx-network:
    driver: bridge
    name: phpnx-network

# Volumes persistants
volumes:
  phpnx-logs:
    name: phpnx-logs
  phpnx-mysql-data:
    name: phpnx-mysql-data
  phpnx-postgres-data:
    name: phpnx-postgres-data
  phpnx-redis-data:
    name: phpnx-redis-data
  phpnx-portainer-data:
    name: phpnx-portainer-data